name: backup-secrets
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: age public key to encrypt to
        required: true
permissions: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq age >/dev/null 2>&1 || (curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar xz && sudo mv age/age /usr/local/bin/)
          printf '%s' "$SECRETS_JSON" | age -r "${{ inputs.recipient }}" > secrets.repo.json.age
          printf '%s' "$VARS_JSON" | age -r "${{ inputs.recipient }}" > vars.repo.json.age
      - uses: actions/upload-artifact@v4
        with: { name: backup-secrets-repo, path: "*.age", retention-days: 1 }
