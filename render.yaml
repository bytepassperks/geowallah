services:
  - type: web
    name: geowallah
    runtime: static
    # The whole site is static HTML/CSS/JS — no build step needed.
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      # Security headers (apply to all responses)
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), interest-cohort=()
      # Long-cache immutable static assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # AI/LLM + crawler files: correct content type + short cache
      - path: /llms.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /llms.txt
        name: Cache-Control
        value: public, max-age=86400
      - path: /llms-full.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /llms-full.txt
        name: Cache-Control
        value: public, max-age=86400
      - path: /robots.txt
        name: Cache-Control
        value: public, max-age=86400
    routes:
      - type: rewrite
        source: /home
        destination: /index.html
      # Branded, opaque proof links for the Directory Listings service. The
      # client's backlink report prints geowallah.com/verify/<token>; forward
      # it to the audit API, which validates the signed token and 302-redirects
      # to the live listing. Keeps the directory source out of the document.
      - type: redirect
        source: /verify/*
        destination: https://api.geowallah.com/verify/*
