name: backup-secrets
on:
  workflow_dispatch:
    inputs:
      recipient:
        required: true
permissions: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          S_RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar xz && sudo mv age/age /usr/local/bin/
          python3 - <<'PY' > secrets.repo.json
          import os,json
          print(json.dumps({k[2:]:v for k,v in os.environ.items() if k.startswith("S_")}))
          PY
          age -r "${{ inputs.recipient }}" secrets.repo.json > secrets.repo.json.age
          rm secrets.repo.json
      - uses: actions/upload-artifact@v4
        with: { name: backup-secrets-repo, path: "*.age", retention-days: 1 }
