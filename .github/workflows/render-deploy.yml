name: Deploy to Render

# Reliable deploys: Render's GitHub App auto-deploy occasionally misses push
# events, leaving the live site stale. This workflow deterministically triggers
# a Render deploy via the service Deploy Hook on every push to deploy, then
# announces the deploy automatically: changed URLs to IndexNow (Bing / Yandex /
# Seznam) and the sitemap to Google Search Console. Covers any deploy — manual
# PR merge or the blog drip.
#
# It also regenerates sitemap.xml from the page tree first, so blog-drip posts
# (and any new page) always make it into the sitemap without hand-editing. The
# regenerated sitemap is committed back to deploy BEFORE the deploy is
# triggered, so Render publishes the complete, current sitemap.

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    # The sitemap auto-commit pushes back to deploy, which re-triggers this
    # workflow. Skip only that bot commit (its subject starts with the marker
    # below) to avoid an infinite loop and a redundant deploy. Uses startsWith
    # (not contains) so an unrelated commit/PR body mentioning the marker still
    # deploys normally.
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: regenerate sitemap') }}
    steps:
      - name: Checkout (full history for accurate lastmod)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate sitemap from page tree
        run: |
          python3 scripts/gen_sitemap.py
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap already current; nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: regenerate sitemap [skip-sitemap]"
            git push origin HEAD:deploy
            echo "Committed regenerated sitemap."
          fi

      - name: Trigger Render deploy hook
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render deploy hook responded with HTTP $code"
          # Render returns 2xx (typically 201/202 Accepted) when the deploy is queued.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Deploy hook failed"; exit 1
          fi

      - name: Wait for deploy to go live
        run: sleep 120

      - name: Submit changed URLs to IndexNow
        # Diff the original push range (explicit SHAs) so the post URLs are
        # picked up even though the sitemap auto-commit moved HEAD.
        env:
          DIFF_BASE: ${{ github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
        run: python3 scripts/indexnow_ping.py

      - name: Submit sitemap to Google Search Console
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: |
          python3 -m pip install --quiet google-auth
          python3 scripts/gsc_submit_sitemap.py
