name: Deploy to Render

# Reliable deploys: Render's GitHub App auto-deploy occasionally misses push
# events, leaving the live site stale. This workflow deterministically triggers
# a Render deploy via the service Deploy Hook on every push to deploy, then
# announces the deploy automatically: changed URLs to IndexNow (Bing / Yandex /
# Seznam) and the sitemap to Google Search Console. Covers any deploy — manual
# PR merge or the blog drip.

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with previous commit for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Trigger Render deploy hook
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render deploy hook responded with HTTP $code"
          # Render returns 2xx (typically 201/202 Accepted) when the deploy is queued.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Deploy hook failed"; exit 1
          fi

      - name: Wait for deploy to go live
        run: sleep 120

      - name: Submit changed URLs to IndexNow
        run: python3 scripts/indexnow_ping.py

      - name: Submit sitemap to Google Search Console
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: |
          python3 -m pip install --quiet google-auth
          python3 scripts/gsc_submit_sitemap.py
