services:
  - type: web
    name: geowallah
    runtime: static
    # The whole site is static HTML/CSS/JS — no build step needed.
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA-style fallback not needed (multi-page), but serve custom 404
      - type: rewrite
        source: /home
        destination: /index.html
